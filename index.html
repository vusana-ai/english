<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>매일 영단어 - 유치원부터 대학까지</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+KR:wght@500;700;900&display=swap');
  body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(180deg,#e0f2fe 0%,#fef9c3 100%); min-height:100vh; user-select:none; -webkit-tap-highlight-color:transparent; }
  .eng { font-family: 'Fredoka', sans-serif; }
  .bounce { transition: transform .14s cubic-bezier(.34,1.56,.64,1); }
  .bounce:active { transform: scale(.92); }
  @keyframes pop { 0%{transform:scale(.8);opacity:0} 100%{transform:scale(1);opacity:1} }
  .pop { animation: pop .3s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes wob { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }
  .wob { animation: wob 2.4s ease-in-out infinite; display:inline-block; }
  @keyframes bye { to { transform: scale(.6) translateY(-20px); opacity:0; } }
  .bye { animation: bye .35s ease-in forwards; }
  .noscroll::-webkit-scrollbar{display:none} .noscroll{scrollbar-width:none}
</style>
</head>
<body class="flex flex-col items-center p-3 gap-3 text-slate-800">

<header class="w-full max-w-lg bg-white rounded-3xl shadow-md p-3 flex items-center justify-between border-2 border-sky-100">
  <div class="flex items-center gap-2">
    <span class="text-2xl wob">📅</span>
    <div>
      <h1 class="font-black text-base text-sky-600 leading-tight">매일 영단어</h1>
      <p class="text-[10px] font-bold text-slate-400">4살부터 대학까지, 하루하루 쌓는 영어</p>
    </div>
  </div>
  <button id="btnToday" class="px-3 py-1.5 rounded-2xl bg-amber-100 border border-amber-300 text-amber-700 text-xs font-black bounce">⭐ 오늘로</button>
</header>

<nav id="stageTabs" class="w-full max-w-lg grid grid-cols-5 gap-1.5"></nav>
<div id="levelTabs" class="w-full max-w-lg flex gap-1.5 overflow-x-auto noscroll px-0.5 py-0.5"></div>

<!-- 진행도 -->
<div class="w-full max-w-lg bg-white/80 rounded-2xl px-4 py-2.5 flex items-center gap-3 border border-white">
  <span class="text-xs font-black text-slate-500 whitespace-nowrap" id="progLabel">외운 단어</span>
  <div class="flex-1 h-3 bg-slate-100 rounded-full overflow-hidden"><div id="progBar" class="h-full bg-gradient-to-r from-emerald-400 to-teal-500 rounded-full" style="width:0%"></div></div>
  <span class="text-xs font-black text-emerald-600 whitespace-nowrap" id="progNum">0 / 0</span>
</div>

<!-- 오늘의 단어 -->
<main class="w-full max-w-lg bg-white rounded-[2rem] shadow-xl p-5 border-4 border-amber-200 flex flex-col gap-4">
  <div class="flex items-center justify-between">
    <div>
      <div id="dateLabel" class="font-black text-lg text-slate-800">1월 1일</div>
      <div id="dayLabel" class="text-[11px] font-bold text-slate-400"></div>
    </div>
    <span id="badge" class="text-[11px] font-black text-white bg-rose-400 px-3 py-1 rounded-full">오늘의 단어</span>
  </div>
  <div id="cards" class="flex flex-col gap-3"></div>
  <button id="btnShowDone" class="hidden text-xs font-black text-slate-400 underline self-center">외운 단어도 보기</button>
</main>

<!-- 못 외운 단어 -->
<section id="reviewBox" class="w-full max-w-lg bg-white rounded-[2rem] shadow-lg p-4 border-2 border-rose-100 flex flex-col gap-2">
  <div class="flex items-center justify-between">
    <h2 class="font-black text-sm text-rose-500">📌 아직 못 외운 단어</h2>
    <span id="reviewCount" class="text-[11px] font-black text-white bg-rose-400 px-2.5 py-0.5 rounded-full">0개</span>
  </div>
  <p class="text-[10px] font-bold text-slate-400 -mt-1">지난 날짜 단어 중 "외웠어요"를 안 누른 단어가 계속 나와요 (최근 날짜부터)</p>
  <div id="reviewList" class="flex flex-col gap-1.5"></div>
  <button id="btnMore" class="hidden py-2 rounded-xl bg-rose-50 text-rose-500 text-xs font-black bounce">더 보기 ▼</button>
</section>

<!-- 월/날짜 -->
<section class="w-full max-w-lg bg-white rounded-[2rem] shadow-lg p-4 border-2 border-indigo-100 flex flex-col gap-3 mb-6">
  <div id="monthTabs" class="grid grid-cols-6 gap-1.5"></div>
  <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-black text-slate-400">
    <div class="text-rose-400">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-sky-400">토</div>
  </div>
  <div id="dayGrid" class="grid grid-cols-7 gap-1"></div>
  <p class="text-[10px] font-bold text-slate-400 text-center">✅ 그날 단어를 다 외운 날 · ⭐ 오늘</p>
</section>

<script>
const STAGES = [
  { id:'k', name:'유치원', emoji:'🧸', levels:['4살','5살','6살','7살'], perDay:1, color:'bg-pink-400' },
  { id:'e', name:'초등',   emoji:'🎒', levels:['1학년','2학년','3학년','4학년','5학년','6학년'], perDay:1, color:'bg-amber-400' },
  { id:'m', name:'중등',   emoji:'📘', levels:['1학년','2학년','3학년'], perDay:2, color:'bg-emerald-500' },
  { id:'h', name:'고등',   emoji:'📝', levels:['1학년','2학년','3학년'], perDay:2, color:'bg-sky-500' },
  { id:'u', name:'대학',   emoji:'🎓', levels:['1학년','2학년','3학년'], perDay:2, color:'bg-indigo-500' },
];
const BADGE_COLORS = ['bg-rose-100 text-rose-500','bg-amber-100 text-amber-600','bg-emerald-100 text-emerald-600','bg-sky-100 text-sky-600','bg-indigo-100 text-indigo-600','bg-purple-100 text-purple-600'];
const MD = [31,28,31,30,31,30,31,31,30,31,30,31];
const now = new Date();
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} } };
let memo = new Set(store.get('memorized', []));
let st = store.get('stage', 0), lv = store.get('level', 0);
let mon = now.getMonth()+1, day = now.getDate();
let showDone = false, reviewShown = 12;
const loading = {};

function dayIndex(m,d){ let i=0; for(let k=0;k<m-1;k++) i+=MD[k]; return i + Math.min(d,MD[m-1]) - 1; } // 2/29 → 2/28
function pool(){ return (window.WORDS||{})[STAGES[st].id]; }
function wordsOf(idx){ const s=STAGES[st], p=pool(); if(!p) return []; const base = lv*365*s.perDay + idx*s.perDay; return p.slice(base, base+s.perDay); }
function key(w){ return w[0].toLowerCase(); }
function ensureData(cb){
  const id = STAGES[st].id;
  if ((window.WORDS||{})[id]) return cb();
  if (loading[id]) { loading[id].push(cb); return; }
  loading[id] = [cb];
  const sc = document.createElement('script'); sc.src = `data/words_${id}.js`;
  sc.onload = sc.onerror = () => { const l = loading[id]; loading[id] = null; l.forEach(f=>f()); };
  document.head.appendChild(sc);
}

// ---------- 음성 (지금은 브라우저 기본 음성) ----------
let voices = [];
if ('speechSynthesis' in window) { const lv_ = ()=>voices = speechSynthesis.getVoices()||[]; lv_(); speechSynthesis.onvoiceschanged = lv_; }
function speak(text, rate=0.85){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=rate;
  const v = voices.find(v=>/en(-|_)US/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang)); if (v) u.voice = v;
  window._u = u; speechSynthesis.speak(u);
}
const PH = {a:'ah',b:'buh',c:'kuh',d:'duh',e:'eh',f:'fff',g:'guh',h:'huh',i:'ih',j:'juh',k:'kuh',l:'lll',m:'mmm',n:'nnn',o:'aw',p:'puh',q:'kwuh',r:'ruh',s:'sss',t:'tuh',u:'uh',v:'vvv',w:'wuh',x:'ks',y:'yuh',z:'zzz'};
window.phon = c => speak(PH[c]||c, .95);
window.say = w => speak(w);

// ---------- 외움 ----------
window.toggleMemo = (w, el) => {
  const k = w.toLowerCase();
  const done = () => { if (memo.has(k)) memo.delete(k); else memo.add(k); store.set('memorized', [...memo]); renderAll(); };
  const card = el && el.closest('[data-card]');
  if (card && !memo.has(k)) { card.classList.add('bye'); setTimeout(done, 320); } else done();
};

function picture(w, big){
  if (w[2]) return `<div class="${big?'text-7xl wob':'text-2xl'} leading-none">${w[2]}</div>`;
  const c = BADGE_COLORS[w[0].charCodeAt(0)%BADGE_COLORS.length];
  return big ? `<div class="w-24 h-24 rounded-[1.75rem] ${c} flex items-center justify-center eng text-5xl font-bold shadow-inner">${w[0][0].toUpperCase()}</div>`
             : `<div class="w-8 h-8 rounded-xl ${c} flex items-center justify-center eng text-lg font-bold">${w[0][0].toUpperCase()}</div>`;
}
function tiles(word){
  const L = word.length, sz = L>=12?'w-[22px] h-8 text-sm border-2':L>=10?'w-6 h-9 text-base border-2':L>=8?'w-8 h-11 text-xl border-2':L>=6?'w-10 h-12 text-2xl border-[3px]':'w-11 h-14 text-3xl border-4';
  return word.split('').map(c=>{
    if (!/[a-z]/i.test(c)) return `<div class="w-2"></div>`;
    const v='aeiou'.includes(c.toLowerCase());
    return `<button onclick="phon('${c.toLowerCase()}')" class="${sz} rounded-xl ${v?'bg-rose-50 border-rose-300 text-rose-500':'bg-sky-50 border-sky-300 text-sky-600'} eng font-bold bounce">${c}</button>`;
  }).join('');
}
function esc(s){ return s.replace(/'/g,"\\'"); }

function renderStages(){
  stageTabs.innerHTML = STAGES.map((s,i)=>`<button onclick="setStage(${i})" class="py-2 rounded-2xl text-xs font-black bounce flex flex-col items-center ${i===st?s.color+' text-white shadow-md':'bg-white text-slate-500 border border-slate-200'}"><span class="text-lg leading-none">${s.emoji}</span>${s.name}</button>`).join('');
  levelTabs.innerHTML = STAGES[st].levels.map((l,i)=>`<button onclick="setLevel(${i})" class="px-3.5 py-1.5 rounded-full text-xs font-black whitespace-nowrap bounce ${i===lv?'bg-slate-800 text-white':'bg-white text-slate-500 border border-slate-200'}">${l}</button>`).join('');
}
function renderProgress(){
  const s=STAGES[st], p=pool(); if(!p) return;
  const all = p.slice(lv*365*s.perDay, (lv+1)*365*s.perDay), n = all.filter(w=>memo.has(key(w))).length;
  progLabel.textContent = `${s.name} ${s.levels[lv]}`;
  progNum.textContent = `${n} / ${all.length}`;
  progBar.style.width = (all.length? n/all.length*100 : 0) + '%';
}
function renderMonths(){
  monthTabs.innerHTML = Array.from({length:12},(_,i)=>i+1).map(m=>`<button onclick="setMonth(${m})" class="py-1.5 rounded-xl text-xs font-black bounce ${m===mon?'bg-indigo-500 text-white shadow':'bg-slate-100 text-slate-500'}">${m}월</button>`).join('');
  const y = now.getFullYear(), first = new Date(y,mon-1,1).getDay(), dim = new Date(y,mon,0).getDate();
  let h=''; for(let i=0;i<first;i++) h+='<div></div>';
  for(let d=1; d<=dim; d++){
    const isToday = (mon===now.getMonth()+1 && d===now.getDate()), sel = d===day;
    const ws = wordsOf(dayIndex(mon,d)), allDone = ws.length && ws.every(w=>memo.has(key(w)));
    h += `<button onclick="setDay(${d})" class="aspect-square rounded-xl text-xs font-black bounce relative ${sel?'bg-amber-400 text-white shadow':allDone?'bg-emerald-50 text-emerald-600 border border-emerald-200':isToday?'bg-amber-50 text-amber-600 border-2 border-amber-300':'bg-slate-50 text-slate-600'}">${d}${isToday?'<span class="absolute -top-1 -right-1 text-[9px]">⭐</span>':''}${allDone?'<span class="absolute bottom-0 right-0.5 text-[8px]">✅</span>':''}</button>`;
  }
  dayGrid.innerHTML = h;
}
function card(w,i){
  const done = memo.has(key(w)), W = esc(w[0]);
  return `<div data-card class="pop rounded-3xl ${done?'bg-slate-50 border-slate-200 opacity-70':'bg-gradient-to-b from-amber-50 to-white border-amber-100'} border-2 p-4 flex flex-col items-center gap-3" style="animation-delay:${i*80}ms">
    ${picture(w,true)}
    <div class="eng text-3xl font-bold text-slate-700 tracking-wide">${w[0]}</div>
    <div class="text-lg font-black text-center leading-snug">${w[1]}</div>
    <div class="flex flex-wrap justify-center gap-1">${tiles(w[0])}</div>
    <div class="grid grid-cols-2 gap-2 w-full">
      <button onclick="say('${W}')" class="py-3 rounded-2xl bg-gradient-to-r from-sky-400 to-indigo-500 text-white font-black bounce shadow shadow-sky-200">🔊 단어 읽기</button>
      <button onclick="toggleMemo('${W}',this)" class="py-3 rounded-2xl ${done?'bg-slate-200 text-slate-500':'bg-gradient-to-r from-emerald-400 to-teal-500 text-white shadow shadow-emerald-200'} font-black bounce">${done?'↩️ 다시 외우기':'✅ 외웠어요'}</button>
    </div>
  </div>`;
}
function renderCards(){
  const s = STAGES[st], ws = wordsOf(dayIndex(mon,day));
  const isToday = (mon===now.getMonth()+1 && day===now.getDate());
  dateLabel.textContent = `${mon}월 ${day}일`;
  dayLabel.textContent = `${s.name} ${s.levels[lv]} · 하루 ${s.perDay}개`;
  badge.textContent = isToday ? '오늘의 단어' : '선택한 날짜';
  badge.className = 'text-[11px] font-black text-white px-3 py-1 rounded-full ' + (isToday?'bg-rose-400':'bg-slate-400');
  if (!ws.length) { cards.innerHTML = `<div class="text-center py-10 text-sm font-bold text-slate-400">단어를 불러오는 중...</div>`; return; }
  const todo = ws.filter(w=>!memo.has(key(w))), doneW = ws.filter(w=>memo.has(key(w)));
  let h = todo.map(card).join('');
  if (!todo.length) h = `<div class="pop text-center py-8 rounded-3xl bg-emerald-50 border-2 border-emerald-200"><div class="text-5xl mb-2">🎉</div><div class="font-black text-emerald-600">이 날 단어를 모두 외웠어요!</div></div>`;
  if (showDone) h += doneW.map((w,i)=>card(w,i+todo.length)).join('');
  cards.innerHTML = h;
  btnShowDone.classList.toggle('hidden', !doneW.length);
  btnShowDone.textContent = showDone ? '외운 단어 숨기기' : `외운 단어도 보기 (${doneW.length})`;
}
function renderReview(){
  const s = STAGES[st], p = pool(); if(!p) return;
  const idx = dayIndex(mon,day), list = [];
  for (let i=idx-1; i>=0; i--) { const ws = wordsOf(i); for (const w of ws) if (!memo.has(key(w))) list.push([w,i]); }
  reviewCount.textContent = `${list.length}개`;
  reviewBox.classList.toggle('hidden', !list.length);
  const md = i => { let m=0; while(i>=MD[m]){ i-=MD[m]; m++; } return `${m+1}/${i+1}`; };
  reviewList.innerHTML = list.slice(0, reviewShown).map(([w,i])=>{ const W=esc(w[0]); return `
    <div data-card class="flex items-center gap-2 p-2 rounded-2xl bg-slate-50 border border-slate-100">
      ${picture(w,false)}
      <div class="flex-1 min-w-0"><div class="eng font-bold text-slate-700 leading-tight">${w[0]}</div><div class="text-[11px] font-bold text-slate-500 truncate">${w[1]}</div></div>
      <span class="text-[9px] font-bold text-slate-300">${md(i)}</span>
      <button onclick="say('${W}')" class="w-9 h-9 rounded-xl bg-sky-100 text-sky-600 bounce">🔊</button>
      <button onclick="toggleMemo('${W}',this)" class="px-2.5 h-9 rounded-xl bg-emerald-500 text-white text-[11px] font-black bounce">✅ 외움</button>
    </div>`; }).join('');
  btnMore.classList.toggle('hidden', list.length <= reviewShown);
}
function renderAll(){ renderStages(); renderProgress(); renderMonths(); renderCards(); renderReview(); }
function go(){ ensureData(renderAll); renderAll(); }
window.setStage = i => { st=i; lv=0; reviewShown=12; store.set('stage',st); store.set('level',lv); go(); };
window.setLevel = i => { lv=i; reviewShown=12; store.set('level',lv); go(); };
window.setMonth = m => { mon=m; day=Math.min(day, MD[m-1] + (m===2 && new Date(now.getFullYear(),1,29).getMonth()===1 ? 1:0)); reviewShown=12; renderAll(); };
window.setDay = d => { day=d; reviewShown=12; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); };
btnToday.onclick = () => { mon=now.getMonth()+1; day=now.getDate(); reviewShown=12; renderAll(); };
btnShowDone.onclick = () => { showDone=!showDone; renderCards(); };
btnMore.onclick = () => { reviewShown += 24; renderReview(); };
go();
</script>
</body>
</html>
